<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق الطقس - عبدالرحمن</title>
    <link rel="stylesheet" href="weather-style.css">
</head>
<body>
    <div class="container">
        <h1>️ تطبيق الطقس</h1>
        <p class="subtitle">اعرف حالة الطقس في أي مدينة حول العالم</p>
        
        <div class="search-box">
            <input type="text" id="cityInput" placeholder="اكتب اسم المدينة (مثلاً: Cairo, Alexandria)">
            <button onclick="getWeather()" class="search-btn">بحث</button>
        </div>
        
        <div id="weatherResult" class="weather-result">
            <p class="hint">اكتب اسم مدينة واضغط بحث لعرض حالة الطقس</p>
        </div>
        
        <a href="index.html" class="back-link">← الرجوع للصفحة الرئيسية</a>
    </div>
    
    <script src="weather.js"></script>
</body>
</html>
