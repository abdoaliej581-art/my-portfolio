<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قائمة المهام - عبدالرحمن</title>
    <link rel="stylesheet" href="todo-style.css">
</head>
<body>
    <div class="container">
        <h1>📝 قائمة مهامي</h1>
        
        <div class="input-section">
            <input type="text" id="taskInput" placeholder="أضف مهمة جديدة...">
            <button onclick="addTask()" class="add-btn">إضافة</button>
        </div>
        
        <ul id="taskList"></ul>
        
        <div class="stats">
            <p>المهام المتبقية: <span id="taskCount">0</span></p>
        </div>
        
        <a href="index.html" class="back-link">← الرجوع للصفحة الرئيسية</a>
    </div>
    
    <script src="todo.js"></script>
</body>
</html>
